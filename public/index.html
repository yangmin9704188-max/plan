<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>작업판 · 개발 대시보드</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">작</div>
        <div class="brand-name">작업판 <span>개발 대시보드</span></div>
      </div>
      <a class="source-chip" id="source-chip" target="_blank" rel="noopener noreferrer" title="GPT가 기획을 저장하는 위치">
        <span class="dot" id="source-dot"></span><span id="source-label">기능 파일 확인 중</span>
      </a>
    </div>
    <div class="topbar-right">
      <span class="sync-time" id="sync-time"></span>
      <button type="button" class="button button-primary" id="refresh-button">
        <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.76-4.24M16 4v3.5h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>새로고침</span>
      </button>
    </div>
  </header>

  <aside class="sidebar" aria-label="메뉴">
    <div class="side-label">MENU</div>
    <nav class="side-nav">
      <button type="button" class="nav-item active" data-view="active">
        <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4.5h14M3 10h14M3 15.5h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>대시보드</span><span class="nav-count" id="count-active">0</span>
      </button>
      <button type="button" class="nav-item" data-view="done">
        <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>완료</span><span class="nav-count" id="count-done">0</span>
      </button>
    </nav>
    <div class="side-note">
      <div class="side-note-title">읽기 전용 · 수동 새로고침</div>
      <div>기획과 PR은 GitHub에서 읽고, 체크 결과만 이 PC에 저장합니다.</div>
    </div>
  </aside>

  <div class="main-wrap">
    <main class="main">
      <section class="page-head">
        <div>
          <h1 id="page-title">대시보드</h1>
          <p id="page-subtitle">기획 → 개발 → 내 확인. 확인을 마치면 완료로 넘기세요.</p>
        </div>
        <div class="kpis" id="kpis"></div>
      </section>

      <div class="filter-bar">
        <div class="tabs" id="product-tabs" role="tablist" aria-label="제품 필터"></div>
        <label class="search">
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13.2 13.2L17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="기능명, 기획 내용 검색" aria-label="기능 검색">
        </label>
      </div>

      <div id="notices"></div>
      <section class="feature-list" id="feature-list" aria-live="polite"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
